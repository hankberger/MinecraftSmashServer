# Local integration tests only. The main compose file remains authenticated.
services:
  proxy:
    environment:
      SMASH_ONLINE_MODE: "false"
      SMASH_ALLOW_OFFLINE_TEST: "true"
  lobby:
    environment:
      JVM_OPTS: "-Dsmash_vanilla.autoQueue=true"
  arena-a:
    environment:
      SMASH_TEST_CONTROL: "true"
    ports: ["127.0.0.1:18081:8081"]
  arena-b:
    environment:
      SMASH_TEST_CONTROL: "true"
    ports: ["127.0.0.1:18082:8081"]
