plugins { id 'net.fabricmc.fabric-loom' version "${loom_version}" }
repositories { mavenCentral() }
evaluationDependsOn(':network')
dependencies {
    implementation project(':network')
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
test { useJUnitPlatform() }
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}
tasks.withType(JavaCompile).configureEach { options.release = 25 }
java { withSourcesJar() }
jar { from project(':network').sourceSets.main.output }
// Local launches have their own build outputs, including the shared network JAR.
// This also lets a fixed launcher run alongside older instances that locked build/libs.
if (project.hasProperty('localRuntime')) {
    allprojects { p ->
        p.tasks.withType(Jar).configureEach {
            destinationDirectory.set(rootProject.layout.buildDirectory.dir("local-runtime-artifacts/${p.name}"))
        }
    }
}
fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'smash_vanilla_test'
        enableGameTests = false
        enableClientGameTests = true
        eula = project.hasProperty('dedicatedTests')
    }
}
loom.runs.clientGameTest { programArg '--offlineDeveloperMode' }
if (project.hasProperty('packedTests')) loom.runs.clientGameTest { vmArg '-Dsmash_vanilla.packedTests=true' }
else loom.runs.clientGameTest { vmArg '-Dsmash_vanilla.legacyTests=true' }
if (project.hasProperty('lobbyTests')) loom.runs.clientGameTest { vmArg '-Dsmash_vanilla.lobbyTests=true' }
if (project.hasProperty('winnerTests')) loom.runs.clientGameTest { vmArg '-Dsmash_vanilla.winnerTest=true' }
if (project.hasProperty('combatTests')) loom.runs.clientGameTest { vmArg '-Dsmash_vanilla.combatTest=true' }
if (project.hasProperty('movementTests')) loom.runs.clientGameTest { vmArg '-Dsmash_vanilla.movementTest=true' }
if (project.hasProperty('ledgeTests')) loom.runs.clientGameTest { vmArg '-Dsmash_vanilla.ledgeTest=true' }
if (project.hasProperty('kitTests')) loom.runs.clientGameTest { vmArg '-Dsmash_vanilla.kitTest=true' }
if (project.hasProperty('networkTests')) loom.runs.clientGameTest { vmArg '-Dsmash_vanilla.networkTest=true' }
if (project.hasProperty('mapTests')) loom.runs.clientGameTest { vmArg '-Dsmash_vanilla.mapTest=true' }
if (project.hasProperty('showcaseTests')) loom.runs.clientGameTest { vmArg '-Dsmash_vanilla.showcaseTest=true' }
if (project.hasProperty('matchmakingTests')) loom.runs.clientGameTest { vmArg '-Dsmash_vanilla.matchmakingTest=true' }
loom.runs.server { runDir 'runtime/server'; programArg 'nogui' }
tasks.register('prepareLocalRuntime') {
    dependsOn jar, downloadAssets, configurations.runtimeClasspath
    doLast {
        def runtime = file(providers.gradleProperty('smashRuntimeDir').getOrElse('runtime'))
        def out = new File(runtime, 'server-classpath.txt')
        out.parentFile.mkdirs()
        def dependencies = sourceSets.main.runtimeClasspath.files - sourceSets.main.output.files
        def buildRoots = allprojects.collect { it.layout.buildDirectory.get().asFile.toPath() }
        def classpath = ([tasks.jar.archiveFile.get().asFile] + dependencies.toList()).collect { artifact ->
            if (!buildRoots.any { artifact.toPath().startsWith(it) }) return artifact
            // Running Java processes only open immutable copies, never Gradle's writable output.
            def contents = artifact.bytes
            def digest = java.security.MessageDigest.getInstance('SHA-256').digest(contents).encodeHex().toString()
            def snapshot = new File(runtime, "server-libs/${digest}/${artifact.name}")
            if (!snapshot.exists()) {
                snapshot.parentFile.mkdirs()
                java.nio.file.Files.write(snapshot.toPath(), contents, java.nio.file.StandardOpenOption.CREATE_NEW)
            } else if (java.security.MessageDigest.getInstance('SHA-256').digest(snapshot.bytes).encodeHex().toString() != digest) {
                throw new GradleException("Local runtime snapshot is damaged: ${snapshot}")
            }
            return snapshot
        }
        out.setText(classpath.join(File.pathSeparator), 'UTF-8')
    }
}

tasks.register('serverBundle', Zip) {
    dependsOn jar
    archiveFileName = "smash-vanilla-mvp-${project.version}.zip"
    destinationDirectory = layout.projectDirectory.dir('release')
    from(tasks.jar) { into 'mods' }
    from({ configurations.runtimeClasspath.files.find { it.name == "fabric-api-${project.fabric_api_version}.jar" } }) { into 'mods' }
    from('README.md', 'KITS.md', 'SERVER.md', 'NETWORK.md', 'MIGRATION.md', 'MAPS.md', 'UI_PACK.md', 'server.properties.example')
}

tasks.register('containerArtifacts', Copy) {
    dependsOn jar, ':proxy:jar'
    into layout.buildDirectory.dir('container')
    from(tasks.jar) { rename { 'smash-vanilla.jar' } }
    from(project(':proxy').tasks.named('jar')) { rename { 'smash-proxy.jar' } }
    from(project(':network').tasks.named('jar')) { rename { 'health.jar' } }
    from({ configurations.runtimeClasspath.files.find { it.name == "fabric-api-${project.fabric_api_version}.jar" } })
}

tasks.register('networkBundle', Zip) {
    archiveFileName = "smash-network-deploy-${project.version}.zip"
    destinationDirectory = layout.projectDirectory.dir('release')
    from('compose.yaml', 'NETWORK.md')
    from('deploy') {
        into 'deploy'
        exclude 'secrets/**', 'vendor/**', '__pycache__/**', '.rollout-lock/**', 'deployed-images.json'
    }
}
